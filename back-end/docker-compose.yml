services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: silentinterview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SilentInterview_DB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - silentinterview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-SilentInterview_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ─── ASP.NET Core API ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: silentinterview-api
    container_name: silentinterview-api
    restart: unless-stopped
    env_file:
      - .env
      - ../frontend/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      Jwt__Issuer: "SilentInterview"
      Jwt__Audience: "SilentInterviewUsers"
      Jwt__Key: "${JWT_KEY:?JWT_KEY must be set in back-end/.env}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-SilentInterview_DB};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};"
    ports:
      - "5000:8080"
    volumes:
      - silentinterview_api_uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 8s
      retries: 12
      start_period: 20s

  # ─── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:5000/api/v1}"
    image: silentinterview-frontend
    container_name: silentinterview-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  silentinterview_postgres_data:
    name: silentinterview_postgres_data
  silentinterview_api_uploads:
    name: silentinterview_api_uploads
